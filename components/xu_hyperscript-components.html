<!-- Whole Document Components -->
<script type="text/hyperscript-template"
        component="xu60-version"
        _="init
              fetch `/meta/object/${@xu-object}?nobody` as JSON
              set ^metadata to the result
              set @xu-previous to ^metadata.previous_version.id
              set @xu-current to ^metadata.id
              set @xu-next to ^metadata.next_version.id
              end">
  <div class="content" hx-get="/object/${@xu-current}" hx-trigger="hsDone" hx-swap="textContent" _="on mutation of @hx-get trigger hsDone(current:^metadata)"><slot/></div>
</script>

<script type="text/hyperscript-template" component="xu60-parallel"></script>
<!-- Document Fragment Components -->
<script type="text/hyperscript-template" component="xu60-change"></script>
<script type="text/hyperscript-template" component="xu60-note"></script>
<script type="text/hyperscript-template" component="xu60-quote"></script>
<script type="text/hyperscript-template" component="xu60-slice"></script>
